# ==============================================================================
# keyd — macOS-style "Cmd" layer (full behaviour)
# ==============================================================================
# Managed by dotfiles. Install with: make keyd
# Docs: man keyd.rvaiya   |   https://github.com/rvaiya/keyd
#
# The physical Win/Super key becomes macOS Cmd:
#   - tap Super          -> GNOME Activities (unchanged)
#   - hold Super + key   -> Cmd shortcuts below
#
# `[cmd:C]` emulates the Ctrl modifier for every key with no explicit mapping,
# so Cmd+S saves, Cmd+Z undoes, Cmd+A selects all, Cmd+F finds, Cmd+W closes,
# Cmd+Q quits, Cmd+N opens, Cmd+P prints, Cmd+R reloads, Cmd+T new tab, ...
# exactly like macOS (Cmd == Ctrl on Linux).
#
# NOTE: keyd only treats `#` as a comment at the start of a line — inline
# comments are NOT supported, so keep comments on their own lines.
# ==============================================================================

[ids]
*

[main]
leftmeta = overload(cmd, leftmeta)

[cmd:C]
# --- Clipboard ----------------------------------------------------------------
# Use the Insert chords (not Ctrl+C/V/X) so Ctrl+C stays SIGINT in terminals.
# Both GTK apps and Ghostty treat these as copy/paste/cut.
c = C-insert
v = S-insert
x = S-delete

# --- Navigation ---------------------------------------------------------------
# Cmd+Left/Right -> line start/end; Cmd+Up/Down -> document start/end.
left = home
right = end
up = C-home
down = C-end

# --- Window / app management --------------------------------------------------
# Re-add what :C would otherwise swallow.
tab = M-tab
grave = A-f6
m = M-h
space = M-a
