# ==============================================================================
# keyd application profiles
# ==============================================================================
# Read by keyd-application-mapper (~/.config/keyd/app.conf). Each section is a
# mask layered over the global rules in /etc/keyd/default.conf while a matching
# window is focused.
#
# Class names are normalised by the mapper — lowercased, non-alphanumerics
# replaced with '-' — so Ghostty's `com.mitchellh.ghostty` becomes
# `com-mitchellh-ghostty`. Discover classes with: tail -f ~/.config/keyd/app.log
#
# Bindings target the `cmd` layer (activated by the Super key), so
# `cmd.t = C-S-t` means "while Super is held and t is pressed, send Ctrl+Shift+T".
#
# NOTE: keyd only treats `#` as a comment at the start of a line — inline
# comments are NOT supported (the mapper passes each line verbatim to `keyd
# bind`), so keep comments on their own lines.
# ==============================================================================

# --- Ghostty ------------------------------------------------------------------
# The global [cmd:C] layer turns Cmd+<key> into Ctrl+<key>. Inside a terminal
# that would feed shell control codes, so restore the terminal-level shortcuts
# and neutralise the dangerous ones.
#
#   Cmd+T          -> new tab        (ctrl+shift+t)
#   Cmd+W          -> close tab      (ctrl+shift+w)
#   Cmd+Q          -> quit           (ctrl+shift+q)
#   Cmd+N          -> new window     (ctrl+shift+n)
#   Cmd+F          -> search         (ctrl+shift+f)
#   Cmd+A          -> select all     (ctrl+shift+a)
#   Cmd+D          -> split right    (ctrl+shift+o)
#   Cmd+K          -> clear screen   (ghostty super+k)
#   Cmd+[          -> previous tab   (super+[)
#   Cmd+]          -> next tab       (super+])
#
# MISMATCH: ghostty/config binds these as super+shift+bracket_left/right, so the
# two sides disagree by a Shift and the binding does not fire. Either drop the
# S- on the ghostty side or map shift+leftbrace here. Untested: keyd is not
# installed on this machine.
#
# Also unbound in ghostty/config, so cmd.q, cmd.n, cmd.f, cmd.a and cmd.d reach
# the terminal and do nothing. Ghostty has no keybind action for "search" or
# "select all", so those two need a target other than a Ghostty keybind.
#
[*ghostty*]
cmd.t = C-S-t
cmd.w = C-S-w
cmd.q = C-S-q
cmd.n = C-S-n
cmd.f = C-S-f
cmd.a = C-S-a
cmd.d = C-S-o
cmd.k = M-k
cmd.leftbrace = M-leftbrace
cmd.rightbrace = M-rightbrace

# Footguns — without these, Cmd+S / Cmd+Z reach the shell as Ctrl+S / Ctrl+Z.
#   Ctrl+S = XOFF (freezes terminal output)
#   Ctrl+Z = SIGTSTP (suspends the foreground job)
#
cmd.s = noop
cmd.z = noop
